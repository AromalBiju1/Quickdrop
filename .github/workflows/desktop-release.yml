name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Install Dart packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package Linux artifact
        run: bash tool/package_linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-linux-x64
          path: |
            release/QuickDrop-*-linux-x64.tar.gz
            release/QuickDrop-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install Dart packages
        run: flutter pub get

      - name: Build Windows bundle
        run: flutter build windows --release

      - name: Package Windows artifact
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-windows-x64
          path: |
            release/QuickDrop-*-windows-x64.zip
            release/QuickDrop-*-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    name: Attach artifacts to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quickdrop-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickDrop ${{ github.ref_name }}
          body_path: release/RELEASE.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
